{% extends "base.html" %}
{% block title %}Editar Categoria{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="font-display text-2xl font-bold" style="color:var(--text-primary);">Editar Categoria</h1>
        <a href="/categorias" class="text-sm font-medium transition" style="color:var(--text-secondary);">
            <i data-lucide="arrow-left" class="w-4 h-4 inline mr-1"></i>Voltar
        </a>
    </div>

    <div class="card">
        <form method="post" action="/categorias/{{ cat.id }}/editar">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-medium mb-1.5" style="color:var(--text-muted);">Emoji</label>
                    <input type="text" name="emoji" maxlength="2" value="{{ cat.emoji or '' }}" class="input-field text-center">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1.5" style="color:var(--text-muted);">Nome</label>
                    <input type="text" name="nome" value="{{ cat.nome }}" required class="input-field">
                </div>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="btn-primary">Salvar</button>
                <a href="/categorias" class="px-4 py-2 rounded-xl text-sm font-medium transition" style="background:var(--surface-1); color:var(--text-secondary);">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
