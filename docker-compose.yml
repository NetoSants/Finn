services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finn
      POSTGRES_PASSWORD: finn
      POSTGRES_DB: finn
      TZ: "America/Sao_Paulo"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: finn
      DB_USER: finn
      DB_PASSWORD: finn
      TZ: "America/Sao_Paulo"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: finn
      DB_USER: finn
      DB_PASSWORD: finn
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS}
      TZ: "America/Sao_Paulo"

volumes:
  postgres_data: